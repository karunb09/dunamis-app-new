version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/Dunamis_LMS_Dashboard-main"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      patch-and-minor:
        update-types: ["patch", "minor"]
    labels: ["dependencies", "dashboard"]

  - package-ecosystem: "npm"
    directory: "/Dunamis_LMS_Website-main"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      patch-and-minor:
        update-types: ["patch", "minor"]
    labels: ["dependencies", "website"]

  - package-ecosystem: "npm"
    directory: "/dunamis-lms-backend-main"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      patch-and-minor:
        update-types: ["patch", "minor"]
    labels: ["dependencies", "backend"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "github-actions"]
